<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 뭐 먹지?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .result-box {
            background-color: #fff8f0;
            border: 2px dashed #ff9f43;
            border-radius: 15px;
            padding: 30px 20px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .result-text {
            font-size: 28px;
            font-weight: bold;
            color: #ff6b6b;
        }

        .placeholder-text {
            color: #aaa;
            font-size: 16px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-main {
            background-color: #ff6b6b;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        .btn-main:hover {
            background-color: #ee5253;
            transform: translateY(-2px);
        }

        .btn-search {
            background-color: #03cf5d; /* 네이버 Green */
            color: white;
            display: none; /* 초기에는 숨김 */
            box-shadow: 0 4px 10px rgba(3, 207, 93, 0.3);
        }

        .btn-search:hover {
            background-color: #02b350;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍽️ 오늘 저녁 뭐 먹지?</h1>
        <p class="subtitle">결정이 어려울 땐 버튼을 눌러보세요!</p>

        <div class="result-box" id="resultBox">
            <span class="placeholder-text">아래 버튼을 눌러 음식을 추천받으세요!</span>
        </div>

        <div class="btn-group">
            <button id="recommendBtn" class="btn-main" onclick="recommendFood()">오늘 저녁 뭐 먹지?</button>
            <button id="searchBtn" class="btn-search" onclick="searchRestaurant()">주변 맛집 검색하기</button>
        </div>
    </div>

    <script>
        // 저녁 메뉴 리스트 (원하는 메뉴를 자유롭게 추가/수정 가능합니다)
        const foodList = [
            '김치찌개', '된장찌개', '부대찌개', '삼겹살', '제육볶음',
            '치킨', '피자', '족발', '보쌈', '떡볶이',
            '자장면', '짬뽕', '탕수육', '마라탕', '돈까스',
            '초밥', '라멘', '우동', '파스타', '스테이크',
            '햄버거', '쌀국수', '찜닭', '닭갈비', '곱창'
        ];

        let currentFood = '';

        function recommendFood() {
            const resultBox = document.getElementById('resultBox');
            const recommendBtn = document.getElementById('recommendBtn');
            const searchBtn = document.getElementById('searchBtn');

            // 랜덤 추출
            const randomIndex = Math.floor(Math.random() * foodList.length);
            currentFood = foodList[randomIndex];

            // 화면에 표시
            resultBox.innerHTML = `<span class="result-text">✨ ${currentFood} ✨</span>`;
            
            // 버튼 텍스트 변경
            recommendBtn.textContent = '🔄 다시 뽑기';
            
            // 맛집 검색 버튼 활성화
            searchBtn.style.display = 'block';
        }

        function searchRestaurant() {
            if (!currentFood) return;

            // 네이버 지도 검색 URL (카카오맵으로 변경하고 싶다면 주소 수정 가능)
            const searchUrl = `https://map.naver.com/v5/search/${encodeURIComponent(currentFood + ' 맛집')}`;
            
            // 새 탭에서 검색 결과 열기
            window.open(searchUrl, '_blank');
        }
    </script>
</body>
</html>
